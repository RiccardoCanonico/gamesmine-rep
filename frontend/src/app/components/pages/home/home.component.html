<app-not-found [visible] = "!games || !games.length" resetLinkText="Reset search"></app-not-found>
<div class="container">
    &nbsp;
    <div class="row filters">
        <div class="col-1">Ordina per:</div>
        <div class="col-lg-1 col-sm-12">
             <input type="checkbox" name="price" id="price" class="form-check-input" (click)="filterPrice()">
            <label class="form-check-label" for="price">Prezzo</label>
        </div>
        <div class="col-lg-2 col-sm-12">
            <input type="checkbox" name="alphabet" id="alphabet" class="form-check-input" (click)="filterByAlphabeticalOrder()">
            <label class="form-check-label" for="alphabet">Ordine alfabetico</label>
        </div> 
    </div>
    <div class="row">
        <div class="col-lg-4 col-md-6" *ngFor="let game of games">
            <div class="row">
                <div class="col-12">
                    <a routerLink="/game/{{game.id}}">
                        <img [src]="game.imageUrl" [alt]="game.id"/>
                    </a>
                </div>
            </div>
            <div class="row">
                <div class="col-6">
                    <div class="name">
                        {{game.name}} 
                    </div>
                </div>
                <div class="col-6 d-flex justify-content-end">
                    <div class="price">
                        {{game.price | currency:"EUR"}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
