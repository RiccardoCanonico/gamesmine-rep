<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" routerLink="/">
            <img src="./assets/img/site_icon.png" alt="logo" class="d-inline-block" width="35" height="35">
            Gamesmine
        </a>
        <form class="col-5">
            <app-search></app-search>
        </form>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll" aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end flex-grow-0" id="navbarScroll">
            <ul class="navbar-nav navbar-nav-scroll" style="--bs-scroll-height: 100px;">
                <li class="nav-item">
                    <a class="nav-link" routerLink="/cart-page">

                        Cart<span>3</span>
                    </a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false" routerLink="/login">
                        <fa-icon [icon]="['far', 'user']"></fa-icon>
                        User
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" routerLink="/profile">Profile</a></li>
                        <li><a class="dropdown-item" routerLink="/orders">Orders</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
