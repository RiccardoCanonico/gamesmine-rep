<div class="input-group">
    <input #s type="text" 
        placeholder="Search" 
        (keyup.enter)="search(s.value)" 
        [value]="searchTerm" 
        class="form-control"/>
    <button (click)="search(s.value)" class="btn btn-primary" type="button">Search</button>
</div>
