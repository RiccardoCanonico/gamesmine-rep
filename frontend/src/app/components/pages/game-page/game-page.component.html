<div class="container">
    <img [src]="game.imageUrl" [alt]="game.name" />
    <div class="details">
        <div class="header">
            <span class="name">
                {{game.name}}
            </span>
        </div>
        <div class="rating">
            <span>Rating: {{game.stars}}/5</span>
        </div>
        <div class="genre">
            <span *ngFor="let genre of game.genre">
                {{genre}}
            </span>
        </div>
        <div class="price">
            <span>
               {{game.price | currency}} 
            </span>
        </div>
        <button>Add to cart</button>
    </div>
</div>
