<app-not-found [visible] = "!game" notFoundMessage="Gioco non trovato" resetLinkText="Torna alla home"></app-not-found>
<div *ngIf="game" class="container">
    <div class="row justify-content-around">
        <div class="col-lg-5 img-container col-sm-12">
            <img [src]="game.imageUrl" [alt]="game.name" />           
        </div>
        <div class="col-lg-5 col-sm-12 info-container bg-dark">
            <div class="row">
                <div class="col-12 text-center">
                    <span class="name">
                        {{game.name}}
                    </span>
                </div>
            </div>
            <div class="row">
                <div class="col-12 text-center">
                    <div class="genre">
                        <span *ngFor="let genre of game.genre">
                            {{genre}}
                        </span>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 text-center rating">     
                    <span>
                        {{game.stars}}
                        <fa-icon class="star" [icon]="['fas', 'star']"></fa-icon> 
                    </span>
                </div>
            </div>
            <div class="row" *ngIf="game.availability">
                <div class="col-12 text-center price">     
                    <span>
                        {{game.price | currency:"EUR"}} 
                    </span>
                </div>
            </div>
            <div class="row" *ngIf="game.availability">
                <div class="col-12 text-center">
                    <button (click)="addToCart()" class="btn">Aggiungi al carrello</button>
                </div>
            </div>
            <div class="row" *ngIf="!game.availability">
                <div class="col-12 text-center availability">
                    <fa-icon [icon]="['fas', 'x']" class="cross"></fa-icon> Non Disponibile
                </div>
            </div>
            &nbsp;
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-11 description text-center">  
            {{game.description}}
        </div>
    </div>
</div>
