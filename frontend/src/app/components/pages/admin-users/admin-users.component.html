<div class="container">
    &nbsp;
    <div class="row">
        <table class="table">
            <thead class="table-dark text-center">
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Email</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Indirizzo</th>      
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of users" class="text-center">
                    <th scope="row">{{ user.id }}</th>
                    <td>{{ user.email }}</td>
                    <td>{{ user.name }}</td>
                    <td>{{ user.address }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
