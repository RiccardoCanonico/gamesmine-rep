<div class="container">
    <div class="row">
        <div class="col-lg-6 col-sm-12 text-center">
            <img [src]="game.imageUrl" [alt]="game.name" />           
        </div>
        <div class="col-lg-6 col-sm-12 info-container bg-dark">
            <div class="row">
                <div class="col-12 text-center">
                    <span class="name">
                        {{game.name}}
                    </span>
                </div>
            </div>
            <div class="row">
                <div class="col-12 text-center">
                    <div class="genre">
                        <span *ngFor="let genre of game.genre">
                            {{genre}}
                        </span>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 text-center">
                    <div class="price">
                        <span>
                            {{game.price | currency}} 
                        </span>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 text-center">
                    <button (click)="addToCart()" type="button" class="btn">Add to cart</button>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12 description">
            <p>
                {{game.description}}
            </p>
        </div>
    </div>
    <div class="row">
        
    </div>
</div>
