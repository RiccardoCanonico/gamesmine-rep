<div class="container">
    <div class="row">
        <div class="col-12">
            <h1>Aggiornamento informazioni gioco</h1>
        </div>
    </div>
    &nbsp;
    <form #formUpdate="ngForm" (ngSubmit)="submit(formUpdate)">
        <div class="row">
                <div class="col-6">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" name="name" [(ngModel)]="game.name" ngModel required>
                </div>
                <div class="col-6">
                    <label class="form-label">Prezzo</label>
                    <input type="number" class="form-control" name="price" [(ngModel)]="game.price" ngModel required>
                </div>
                <div class="col-6">
                    <label class="form-label">Generi</label>
                    <input type="text" class="form-control" name="genre" [(ngModel)]="game.genre" ngModel required>
                </div>
                <div class="col-6">
                    <label class="form-label">Url Immagine</label>
                    <input type="text" class="form-control" name="imageUrl" [(ngModel)]="game.imageUrl" ngModel required>
                </div>
                <div class="col-6">
                    <label class="form-label">Valutazione</label>
                    <input type="number" class="form-control" name="stars" [(ngModel)]="game.stars" ngModel min="0" max="5" pattern="[0-9]" required>
                </div>
                <div class="col-6">
                    <label class="form-label">Descrizione</label>
                    <textarea class="form-control" rows="3" name="description" [(ngModel)]="game.description" ngModel required></textarea>
                </div>
                &nbsp;
        </div>
        <div class="row justify-content-center">
            <div class="col-6">
                <button type="submit" [disabled]="!formUpdate.valid" class="btn">Aggiorna</button>
            </div>
        </div>
    </form>
</div>
