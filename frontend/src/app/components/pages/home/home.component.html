<app-not-found [visible] = "!games || !games.length" resetLinkText="Reset search"></app-not-found>
<div class="container">
    <div class="row">
        <div class="col-lg-4 col-md-6" *ngFor="let game of games">
            <div class="row">
                <div class="col-12">
                    <a routerLink="/game/{{game.id}}">
                        <img [src]="game.imageUrl" [alt]="game.id"/>
                    </a>
                </div>
            </div>
            <div class="row">
                <div class="col-6">
                    <div class="name">
                        {{game.name}} 
                    </div>
                </div>
                <div class="col-6 d-flex justify-content-end">
                    <div class="price">
                        {{game.price | currency:"EUR"}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
